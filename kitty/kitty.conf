# =========================================================
# NOIR SIGNAL — KITTY
# =========================================================

# ---------------------------------------------------------
# WINDOW
# ---------------------------------------------------------

background_opacity 0.94
dynamic_background_opacity yes

window_padding_width 14
window_padding_height 12

confirm_os_window_close 0
remember_window_size yes

# Slightly softer visual density
inactive_text_alpha 0.88

# ---------------------------------------------------------
# TYPOGRAPHY
# ---------------------------------------------------------

font_family JetBrainsMono Nerd Font
bold_font auto
italic_font auto
bold_italic_font auto

font_size 11.5

# ---------------------------------------------------------
# CURSOR
# ---------------------------------------------------------

cursor_shape block

cursor #D6A85F
cursor_text_color #090A0C

cursor_blink_interval 0.6
cursor_stop_blinking_after 15

# ---------------------------------------------------------
# BASE COLORS
# ---------------------------------------------------------

background #090A0C
foreground #E7E4DC

selection_background #2A2520
selection_foreground #F1EDE4

# ---------------------------------------------------------
# NOIR SIGNAL ANSI PALETTE
# ---------------------------------------------------------

# Normal

color0  #111318
color1  #C46D6D
color2  #8FA6A0
color3  #D6A85F
color4  #78889A
color5  #9A879A
color6  #7FA09A
color7  #BFC0BA

# Bright

color8  #4C5057
color9  #D77C7C
color10 #A7BCB5
color11 #E2BA70
color12 #91A0B0
color13 #B39AB3
color14 #94B6AF
color15 #E7E4DC

include ~/.cache/noir-signal/kitty-colors.conf