source = ~/.cache/noir-signal/hyprlock-colors.conf

# =========================================================
# NOIR SIGNAL — HYPRLOCK v2
# =========================================================

general {
    hide_cursor = true
    ignore_empty_input = false
    grace = 2
}

label {
    monitor =

    text = "NOIR  /  SIGNAL"

    color = $accent
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    font_weight = 600

    position = 0, 226
    halign = center
    valign = center
}

background {
    monitor =
    path = screenshot

    blur_passes = 3
    blur_size = 7

    noise = 0.015
    contrast = 0.90
    brightness = 0.78
    vibrancy = 0.18
}

# =========================================================
# CLOCK
# =========================================================

label {
    monitor =

    text = cmd[update:1000] echo "$(date '+%I:%M %p')"

    color = $text
    font_size = 64
    font_family = JetBrainsMono Nerd Font
    font_weight = 600

    position = 0, 150
    halign = center
    valign = center
}

# =========================================================
# DATE
# =========================================================

label {
    monitor =

    text = cmd[update:60000] echo "$(date '+%A · %d %B')"

    color = $secondary
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    font_weight = 500

    position = 0, 82
    halign = center
    valign = center
}

# =========================================================
# USER
# =========================================================

label {
    monitor =

    text = $USER

    color = $accent
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    font_weight = 600

    position = 0, -108
    halign = center
    valign = center
}

# =========================================================
# HOST / IDENTITY
# =========================================================

label {
    monitor =

    text = "ARCH  /  HYPRLAND"

    color = $muted
    font_size = 10
    font_family = JetBrainsMono Nerd Font
    font_weight = 500

    position = 0, -138
    halign = center
    valign = center
}

# =========================================================
# PASSWORD
# =========================================================
input-field {
    monitor =

    size = 300, 58

    outline_thickness = 2

    inner_color = $background
    outer_color = $accent

    font_color = $text

    fade_on_empty = false
    hide_input = false

    placeholder_text = <i>Enter password</i>
    placeholder_color = $muted

    dots_center = true
    dots_size = 0.20
    dots_spacing = 0.20
    dots_color = $accent

    check_color = $accent
    fail_color = $danger

    fail_text = <i>Authentication failed</i>

    position = 0, -18
    halign = center
    valign = center
}

label {
    monitor =

    text = "SECURE SESSION  /  WAYLAND"

    color = $muted
    font_size = 9
    font_family = JetBrainsMono Nerd Font
    font_weight = 500

    position = 0, -190
    halign = center
    valign = center
}