source = ~/.cache/noir-signal/hyprlock-colors.conf

# =========================================================
# LUMEN GRID — HYPRLOCK
# =========================================================

general {
    hide_cursor = true
    ignore_empty_input = false
    grace = 2
}

label {
    monitor =

    text = "LUMEN GRID  //  SECURE ENTRY"

    color = $accent
    font_size = 10
    font_family = JetBrainsMono Nerd Font
    font_weight = 600

    position = 0, 252
    halign = center
    valign = center
}

background {
    monitor =
    path = screenshot

    blur_passes = 4
    blur_size = 8

    noise = 0.015
    contrast = 0.95
    brightness = 0.70
    vibrancy = 0.30
}

# =========================================================
# CLOCK
# =========================================================

label {
    monitor =

    text = cmd[update:1000] echo "$(date '+%H:%M')"

    color = $text
    font_size = 76
    font_family = JetBrainsMono Nerd Font
    font_weight = 600

    position = 0, 168
    halign = center
    valign = center
}

# =========================================================
# DATE
# =========================================================

label {
    monitor =

    text = cmd[update:60000] echo "$(date '+%A  //  %d %B')"

    color = $secondary
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    font_weight = 500

    position = 0, 78
    halign = center
    valign = center
}

# =========================================================
# USER
# =========================================================

label {
    monitor =

    text = $USER

    color = $accent
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    font_weight = 600

    position = 0, -112
    halign = center
    valign = center
}

# =========================================================
# HOST / IDENTITY
# =========================================================

label {
    monitor =

    text = "ARCH  /  HYPRLAND"

    color = $muted
    font_size = 10
    font_family = JetBrainsMono Nerd Font
    font_weight = 500

    position = 0, -140
    halign = center
    valign = center
}

# =========================================================
# PASSWORD
# =========================================================
input-field {
    monitor =

    size = 340, 56

    outline_thickness = 1

    inner_color = $surface
    outer_color = $accent

    font_color = $text

    fade_on_empty = false
    hide_input = false

    placeholder_text = <i>Enter password</i>
    placeholder_color = $muted

    dots_center = true
    dots_size = 0.20
    dots_spacing = 0.20
    dots_color = $accent

    check_color = $accent
    fail_color = $danger

    fail_text = <i>Authentication failed</i>

    position = 0, -18
    halign = center
    valign = center
}

label {
    monitor =

    text = "WAYLAND SESSION  //  LUMEN GRID"

    color = $muted
    font_size = 9
    font_family = JetBrainsMono Nerd Font
    font_weight = 500

    position = 0, -190
    halign = center
    valign = center
}